name: SISR
options:
  bundleIdPrefix: com.timelapsetech
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      COPY_PHASE_STRIP: NO
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
packages:
  SISRKit:
    path: Packages/SISRKit
targets:
  SISR:
    type: application
    platform: macOS
    sources:
      - path: SISR
        excludes:
          - "**/.DS_Store"
      - path: SISR/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timelapsetech.sisr
        PRODUCT_NAME: SISR
        INFOPLIST_FILE: SISR/Info.plist
        CODE_SIGN_ENTITLEMENTS: SISR/SISR.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: "1.0.3"
        GENERATE_INFOPLIST_FILE: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_STYLE: non-global
    dependencies:
      - package: SISRKit
    scheme:
      testTargets: []
